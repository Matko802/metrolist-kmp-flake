name: Update Metrolist

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Update sources.nix
        id: update
        run: |
          if ./scripts/update.sh --check; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            ./scripts/update.sh
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify package builds
        if: steps.update.outputs.changed == 'true'
        run: nix build .#default --no-link --print-out-paths
      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          version="$(sed -n 's/^  version = "\(.*\)";$/\1/p' sources.nix)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.nix
          git commit -m "metrolist: update to ${version}"
          git tag -f nightly
          git push origin "HEAD:main"
          git push --force origin nightly
